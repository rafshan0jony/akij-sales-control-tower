# Render.com free-tier deployment blueprint
# Create a new "Web Service" pointing at this repo (Docker) and Render will
# read this file automatically.
services:
  - type: web
    name: akij-sales-analytics
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_DB_PATH
        value: /app/data/app.db
      - key: MSSQL_SERVER
        sync: false
        value: 203.202.241.211
      - key: MSSQL_PORT
        sync: false
        value: "1433"
      - key: MSSQL_USER
        sync: false
        value: mcp_user
      - key: MSSQL_PASSWORD
        sync: false
        value: CHANGE_ME
      - key: MSSQL_DATABASE
        sync: false
        value: DWH
      - key: MSSQL_ENCRYPT
        sync: false
        value: "false"
      - key: MSSQL_TRUST_SERVER_CERTIFICATE
        sync: false
        value: "true"
      - key: SYNC_INTERVAL_MS
        value: "300000"
    disk:
      name: app-data
      mountPath: /app/data
      sizeGB: 1
