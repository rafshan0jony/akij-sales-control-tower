<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akij Essentials — Sales Control Tower</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">A</div>
        <div>
          <div class="brand-name">Akij Essentials Ltd.</div>
          <div class="brand-sub">Sales Control Tower · Rice Bulk</div>
        </div>
      </div>
      <h1>Sign in</h1>
      <p class="muted">Access your sales dashboard</p>
      <form id="login-form">
        <label>Username / Email</label>
        <input id="login-identifier" type="text" autocomplete="username" required />
        <label>Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required />
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
      <p class="login-foot muted">Authorized personnel only. All access is logged.</p>
    </div>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">A</div>
        <div class="sidebar-brand-text">
          <div class="brand-name">Akij Essentials</div>
          <div class="brand-sub">Sales Control Tower</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="sync-pill" id="sync-pill">
          <span class="dot dot-gray"></span><span id="sync-text">Connecting…</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="nav-toggle" title="Menu">☰</button>
          <div class="breadcrumb" id="breadcrumb"></div>
        </div>
        <div class="topbar-right">
          <div class="date-filter">
            <select id="territory-select" class="select"></select>
            <select id="filter-select" class="select"></select>
            <div id="custom-range" class="custom-range hidden">
              <input type="date" id="filter-from" />
              <span>→</span>
              <input type="date" id="filter-to" />
            </div>
          </div>
          <div class="last-updated" id="last-updated"></div>
          <div class="user-menu">
            <button class="user-btn" id="user-btn">
              <span class="avatar" id="user-avatar"></span>
              <span class="user-meta">
                <span id="user-name">…</span>
                <span id="user-role" class="muted">…</span>
              </span>
            </button>
            <div class="user-dropdown hidden" id="user-dropdown">
              <button id="change-password-btn">Change password</button>
              <button id="logout-btn">Sign out</button>
            </div>
          </div>
        </div>
      </header>
      <main id="app" class="app"></main>
    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>
  <div id="modal-root" class="modal-root"></div>

  <script src="/vendor/chart.umd.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
